[build-system]
requires = ["setuptools>=61.0", "wheel", "numpy", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tmgen"
version = "0.1.2"
description = "Library for network traffic matrix generation"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Victor Heorhiadi", email = "v@victorh.net"}]
keywords = ["network", "traffic", "matrix"]
requires-python = ">=3.11"
dependencies = ["numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/progwriter/TMgen"

[project.optional-dependencies]
plotting = ["matplotlib", "seaborn"]
test = ["pytest"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
tmditg = "tmgen.inject.ditg_injector:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tmgen = ["*.pxd", "*.pyi", "py.typed"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests", "docs"]
addopts = "--doctest-glob='*.rst'"
doctest_optionflags = "NORMALIZE_WHITESPACE ALLOW_UNICODE ALLOW_BYTES"

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["matplotlib.*", "seaborn.*"]
ignore_missing_imports = true
