[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel", "numpy", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tmgen"
dynamic = ["version"]
description = "Library for network traffic matrix generation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Victor Heorhiadi", email = "v@victorh.net"}]
keywords = ["network", "traffic", "matrix"]
requires-python = ">=3.11"
dependencies = ["numpy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/progwriter/TMgen"
Documentation = "https://tmgen.readthedocs.io/"
Changelog = "https://github.com/progwriter/TMgen/blob/master/CHANGELOG.md"
Issues = "https://github.com/progwriter/TMgen/issues"
Source = "https://github.com/progwriter/TMgen"

[project.optional-dependencies]
plotting = ["matplotlib", "seaborn"]
test = ["pytest"]
docs = ["sphinx", "sphinx_rtd_theme", "matplotlib", "seaborn"]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "pytest-benchmark",
    "pytest-cov",
    "matplotlib",
    "seaborn",
    "sphinx",
    "sphinx_rtd_theme",
]

[project.scripts]
tmditg = "tmgen.inject.ditg_injector:main"

[tool.setuptools_scm]
# PyPI rejects local version segments, so untagged builds get a plain .devN
local_scheme = "no-local-version"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tmgen = ["*.pyi", "py.typed"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.coverage.run]
source = ["tmgen"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95

[tool.pytest.ini_options]
testpaths = ["tests", "docs"]
addopts = "--doctest-glob='*.rst'"
doctest_optionflags = "NORMALIZE_WHITESPACE ALLOW_UNICODE ALLOW_BYTES"

[tool.mypy]
strict = true
files = ["src", "tests", "tools", "benchmarks"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["matplotlib.*", "seaborn.*"]
ignore_missing_imports = true

[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-* cp315-*"
skip = "*-musllinux_* *-win32 *_i686"
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
