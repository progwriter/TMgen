version: 2

updates:
  # Workflow actions are pinned to major versions and go stale (a Node 20
  # deprecation was the last reminder); keep them current in one PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # Build requirements and dependency ranges in pyproject.toml
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
    groups:
      python:
        patterns: ["*"]
